name: Build iOS Application

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app || true

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Verify Audio Asset & Entitlements
        run: |
          test -f ios/PersonalSafetyAgent/Resources/danger_alarm.wav
          test -f ios/PersonalSafetyAgent/PersonalSafetyAgent.entitlements
          test -f ios/PersonalSafetyAgent/Info.plist
          echo "iOS Assets and Configuration Verified Successfully."

      - name: Build & Archive iOS App
        run: |
          xcodebuild \
            -project ios/PersonalSafetyAgent.xcodeproj \
            -scheme PersonalSafetyAgent \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/PersonalSafetyAgent.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/PersonalSafetyAgent.xcarchive/Products/Applications/PersonalSafetyAgent.app Payload/
          zip -r PersonalSafetyAgent.ipa Payload
          ls -lh PersonalSafetyAgent.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersonalSafetyAgent-IPA
          path: PersonalSafetyAgent.ipa
          retention-days: 90

      - name: Publish GitHub Release with IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.0.0-ios && RELEASE_EXISTS=true || RELEASE_EXISTS=false
          if [ "$RELEASE_EXISTS" = "true" ]; then
            gh release upload v1.0.0-ios PersonalSafetyAgent.ipa --clobber
          else
            gh release create v1.0.0-ios PersonalSafetyAgent.ipa \
              --title "Personal Safety Agent for iPhone v1.0.0" \
              --notes "🚀 **Personal Safety Agent для iPhone (Ready-to-Install .ipa)**

Встановлюється в 1 клік на будь-який iPhone без Mac через:
* **Sideloadly** (Windows / macOS)
* **AltStore** (Windows / macOS)
* **TrollStore / Scarlet / SideStore** (безпосередньо на iPhone)"
          fi
