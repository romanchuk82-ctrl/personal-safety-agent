name: Deploy Cloudflare Worker Backend

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers (24/7 $0 Edge)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker Dependencies
        working-directory: worker
        run: npm install --legacy-peer-deps

      - name: Verify Cloudflare Token & Subdomain
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '7532116e9d16abfc6b7eded7a89c4f72'
        run: |
          node -e "
            async function diag() {
              const rawToken = process.env.CLOUDFLARE_API_TOKEN || '';
              const token = rawToken.trim().replace(/^Bearer\s+/i, '');
              const acc = (process.env.CLOUDFLARE_ACCOUNT_ID || '').trim();
              console.log('Token length:', token.length, 'acc:', acc);

              console.log('--- 1. Bearer Token Verify (trimmed) ---');
              try {
                const r1 = await fetch('https://api.cloudflare.com/client/v4/user/tokens/verify', {
                  headers: { 'Authorization': 'Bearer ' + token }
                });
                console.log(await r1.text());
              } catch (e) { console.error(e); }

              console.log('--- 2. Global Key Test with romanchuk82@gmail.com ---');
              try {
                const r2 = await fetch('https://api.cloudflare.com/client/v4/user', {
                  headers: {
                    'X-Auth-Key': token,
                    'X-Auth-Email': 'romanchuk82@gmail.com'
                  }
                });
                console.log(await r2.text());
              } catch (e) { console.error(e); }

              console.log('--- 3. Direct KV test with trimmed token ---');
              try {
                const r3 = await fetch('https://api.cloudflare.com/client/v4/accounts/' + acc + '/storage/kv/namespaces/8d7944ad493e4455b7bd517a5784417f/keys', {
                  headers: { 'Authorization': 'Bearer ' + token }
                });
                console.log(await r3.text());
              } catch (e) { console.error(e); }

              console.log('--- CF WORKERS SCRIPTS ---');
              try {
                const r3 = await fetch('https://api.cloudflare.com/client/v4/accounts/' + acc + '/workers/scripts', { headers: { Authorization: 'Bearer ' + token } });
                console.log(await r3.text());
              } catch (e) { console.error(e); }

              console.log('--- CF KV KEYS ---');
              try {
                const r4 = await fetch('https://api.cloudflare.com/client/v4/accounts/' + acc + '/storage/kv/namespaces/8d7944ad493e4455b7bd517a5784417f/keys', { headers: { Authorization: 'Bearer ' + token } });
                console.log(await r4.text());
              } catch (e) { console.error(e); }
            }
            diag();
          "

      - name: Deploy with Wrangler
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '7532116e9d16abfc6b7eded7a89c4f72'
        run: npx wrangler deploy
