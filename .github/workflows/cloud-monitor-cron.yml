name: 24/7 Cloud Monitoring Cron

on:
  schedule:
    # Run every 5 minutes (fastest reliable cadence at /year)
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-monitoring-cycles:
    runs-on: ubuntu-latest
    name: Cloud Monitoring Runner
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execute Autonomous Monitoring Cycles
        run: |
          node -e "
            async function loop() {
              for (let i = 1; i <= 5; i++) {
                console.log('Triggering cloud cycle ' + i + ' at ' + new Date().toISOString());
                const res = await fetch('https://personal-safety-backend.lydian-steed.workers.dev/api/monitoring/cycle', {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest'
                  }
                });
                console.log('Response status:', res.status);
                const data = await res.json();
                console.log('Cycle result:', data?.success, 'health:', data?.health?.sources);
                if (i < 5) await new Promise(r => setTimeout(r, 60000));
              }
            }
            loop();
          "
